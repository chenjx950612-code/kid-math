version: "3.8"

services:
  math:
    build: .
    container_name: kid-math
    restart: unless-stopped
    ports:
      - "3333:3333"
    volumes:
      # 代码用绑定挂载：一键更新时 git pull 会写回宿主机目录，容器重启即加载新代码
      - ./:/app
      # 数据也用绑定挂载：data.json 直接出现在宿主机 ./data/ 目录，方便查看和备份
      - ./data:/app/data
    environment:
      - PORT=3333
      - HOST=0.0.0.0
      # 一键更新的超级管理员密码（可在此修改，不必改代码）
      - SUPER_ADMIN_PASSWORD=061204


